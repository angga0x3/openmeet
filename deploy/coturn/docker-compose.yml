services:
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    # Host networking keeps the relayed UDP range simple and avoids NAT surprises.
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --fingerprint
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM}
      --external-ip=${EXTERNAL_IP}
      --min-port=49160
      --max-port=49200
      --no-multicast-peers
      --no-cli
      --stale-nonce=600
